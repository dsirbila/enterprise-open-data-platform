services:
  postgres:
    image: postgres:16
    container_name: eodp-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    profiles:
      - core

  redis:
    image: redis:7-alpine
    container_name: eodp-redis
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    profiles:
      - core

  # ---------- SFTP (lecture 15) ----------
  sftp:
    image: atmoz/sftp:alpine
    container_name: eodp-sftp
    profiles: ["core"]
    ports:
      - "2222:22"
    volumes:
      - ./data/sftp:/home/partner
    command: partner:partnerpass:1001:100:upload,processed,ack

# ---------- Airflow (lecture 17-18) ----------
  airflow-init:
    image: apache/airflow:2.10.2
    container_name: eodp-airflow-init
    profiles: ["orchestration"]
    depends_on: [postgres]
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-eodp_user}:${POSTGRES_PASSWORD:-change_me_locally}@postgres/airflow
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create --username admin --password admin \
          --firstname Admin --lastname User --role Admin --email admin@example.com

  airflow-webserver:
    image: apache/airflow:2.10.2
    container_name: eodp-airflow-web
    profiles: ["orchestration"]
    depends_on: [airflow-init]
    ports:
      - "8081:8080"
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-eodp_user}:${POSTGRES_PASSWORD:-change_me_locally}@postgres/airflow
    volumes:
      - ./src:/opt/airflow/dags/src
      - ./dags:/opt/airflow/dags
      - ./.env:/opt/airflow/dags/.env
    command: webserver

  airflow-scheduler:
    image: apache/airflow:2.10.2
    container_name: eodp-airflow-scheduler
    profiles: ["orchestration"]
    depends_on: [airflow-init]
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-eodp_user}:${POSTGRES_PASSWORD:-change_me_locally}@postgres/airflow
    volumes:
      - ./src:/opt/airflow/dags/src
      - ./dags:/opt/airflow/dags
      - ./.env:/opt/airflow/dags/.env
    command: scheduler
  
  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.0
    container_name: eodp-zookeeper
    profiles: ["streaming"]
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.7.0
    container_name: eodp-kafka
    profiles: ["streaming"]
    depends_on: [zookeeper]
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: eodp-kafka-ui
    profiles: ["streaming"]
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local-kafka
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181

volumes:
  postgres_data:

