services:
  postgres:
    image: postgres:16
    container_name: eodp-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    profiles:
      - core

  redis:
    image: redis:7-alpine
    container_name: eodp-redis
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    profiles:
      - core

  # ---------- SFTP (lecture 15) ----------
  sftp:
    image: atmoz/sftp:alpine
    container_name: eodp-sftp
    profiles: ["core"]
    ports:
      - "2222:22"
    volumes:
      - ./data/sftp:/home/partner
    command: partner:partnerpass:1001:100:upload,processed,ack

volumes:
  postgres_data:

